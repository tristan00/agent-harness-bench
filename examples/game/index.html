<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbor Ledger · protocol example</title>
<style>
:root{font:16px system-ui;color:#e4e9de;background:#131e23}body{max-width:1000px;margin:40px auto;padding:0 24px}h1{font-size:40px;margin:8px 0}small{color:#a7b7b5;letter-spacing:2px}header{display:flex;justify-content:space-between;align-items:center}button,select{font:inherit;color:inherit;background:#263b41;border:1px solid #526667;border-radius:6px;padding:10px;cursor:pointer}button:hover{background:#3e5a59}#stats{display:flex;gap:28px;margin:28px 0;padding:22px;background:#203239;border-radius:8px}main{display:grid;grid-template-columns:2fr 1fr;gap:30px}#map{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#152c37;padding:12px;border-radius:10px}#map button{aspect-ratio:1;font-size:23px;background:#354e3b}#map .port{background:#345e71}#map .farm{background:#627548}#map .market{background:#816744}aside button{margin:4px}p{line-height:1.6;color:#bfcfca}#message{color:#f4cc90;min-height:24px}@media(max-width:650px){main{grid-template-columns:1fr}#stats{flex-wrap:wrap}}
</style>
<header><div><small>RUNNABLE BENCHMARK FIXTURE</small><h1>Harbor Ledger</h1></div><button id="fullscreen">Fullscreen</button></header>
<div id="stats"></div><main><div id="map" aria-label="36 tile map"></div><aside><h2>Grow a trading port</h2><p>Build farms, grow grain, and sell when the market price rises. Markets earn coins every turn.</p><label>Build <select id="kind"><option value="farm">Farm</option><option value="market">Market</option></select></label><p>Click a tile to build or upgrade. Space advances a turn.</p><button onclick="act('step',{ticks:1})">Next turn</button><button onclick="act('step',{ticks:100})">100 turns</button><button onclick="act('trade',{amount:5})">Sell 5 grain</button><button onclick="act('trade',{amount:-5})">Buy 5 grain</button><hr><button onclick="act('save')">Save · S</button><button onclick="act('load')">Load · L</button><button onclick="act('reset')">New game</button><p id="message" role="status"></p></aside></main>
<script>
async function act(action,params={}){try{const r=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,params})});const data=await r.json();document.querySelector('#message').textContent=data.error||'';await refresh()}catch(e){document.querySelector('#message').textContent='Game session has ended.'}}
async function refresh(){const s=await fetch('/state').then(r=>r.json());document.querySelector('#stats').textContent=`Turn ${s.turn}　 ·　Coins ${s.coins.toFixed(1)}　 ·　Grain ${s.grain.toFixed(1)}　 ·　Price ${s.price.toFixed(2)}`;document.querySelector('#map').replaceChildren(...s.tiles.map((t,i)=>{const b=document.createElement('button');b.className=t.kind;b.textContent=({port:'⚓',farm:'♧',market:'◇',plain:'·'})[t.kind]+(t.level||'');b.title=`Tile ${i}: ${t.kind}, level ${t.level}`;b.onclick=()=>act('build',{tile:i,kind:document.querySelector('#kind').value});return b}))}
document.querySelector('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();act('step',{ticks:1})}if(e.key.toLowerCase()==='s')act('save');if(e.key.toLowerCase()==='l')act('load')});refresh();setInterval(()=>refresh().catch(()=>{}),1500);
</script></html>
